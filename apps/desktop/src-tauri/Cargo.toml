[package]
name = "taki-desktop"
version = "0.0.0"
description = "TakiAgent desktop shell"
edition = "2021"
# Effective floor raised to 1.95 by sysinfo 0.39.6 (patch-level MSRV bump); toolchain is `rustup update stable`.
rust-version = "1.95"
# Two bins live here (the Tauri app + the headless test node); `cargo run` means the app.
default-run = "taki-desktop"

[lib]
# The library entry the Tauri mobile-entry macro loads; keep main.rs a thin shim.
name = "taki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The headless e2e/CI node (no window, ScriptedApprover-driven); debug-only at runtime — see its module header.
[[bin]]
name = "taki-node"
path = "src/bin/taki-node.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# protocol-asset: serves the Workspace characters/ subtree to the pet webview via the asset: protocol (#18); the
# scope + CSP live in tauri.conf.json (app.security.assetProtocol). The build script requires this feature when
# assetProtocol is enabled — a mismatch fails `cargo check` (not at runtime), which is why it is pinned here.
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Persists the pet overlay window geometry (position/size) across restarts, scoped to the pet window (issue #14,
# leader decision (a)). Geometry is local window-manager chrome, kept OS-side — it never crosses the WS protocol.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rt-multi-thread: the headless taki-node bin runs its own #[tokio::main] runtime (the app uses Tauri's).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
keyring = "4.1"
xcap = "0.9"
sysinfo = "0.39"
arboard = "3.6"
tracing = "0.1"
# fmt is a default feature; env-filter (RUST_LOG) is opt-in — without a subscriber every tracing line is dropped (R1).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
too_many_lines = "warn"
