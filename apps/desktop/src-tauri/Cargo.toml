[package]
name = "taki-desktop"
version = "0.0.0"
description = "TakiAgent desktop shell"
edition = "2021"
rust-version = "1.88"

[lib]
# The library entry the Tauri mobile-entry macro loads; keep main.rs a thin shim.
name = "taki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
keyring = "4.1"
xcap = "0.9"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
too_many_lines = "warn"
