[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-service-mcp"
version = "0.1.0"
description = "Independent bounded native media clients exposed through standard MCP"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "httpx==0.28.1", "jsonschema==4.26.0"]

[project.scripts]
media-service-mcp = "media_service_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
media_service_bridge = ["schemas/*.json"]
